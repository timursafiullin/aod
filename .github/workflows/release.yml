name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag, plugin.json and CHANGELOG agree
        run: |
          node scripts/dev/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          node scripts/dev/release-notes.mjs "$GITHUB_REF_NAME" --title > title.txt
      - run: node --test
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$(cat title.txt)" --notes-file notes.md --verify-tag $flags
